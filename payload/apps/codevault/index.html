<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeVault · 本地工程索引库</title>
<link rel="stylesheet" href="assets/style.css?v=20261126a">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="glyph">CV</span>
    <div class="brand-text">
      <strong>CodeVault</strong>
      <span id="subtitle">本地工程索引库</span>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="tools">
    <input id="search" type="search" placeholder="搜索项目 / 模块 / 文件…" autocomplete="off">
    <select id="filter" aria-label="状态筛选">
      <option value="all">全部状态</option>
      <option value="active">在用</option>
      <option value="usable">可用</option>
      <option value="prototype">原型</option>
      <option value="delivered">已交付</option>
      <option value="archived">归档</option>
      <option value="empty">空目录</option>
    </select>
  </div>
</header>

<main class="layout">
  <aside class="sidebar" id="list" aria-label="项目列表"></aside>
  <section class="content" id="detail" aria-live="polite"></section>
</main>

<footer class="footer">
  <span id="footNote">数据源 data/projects.json</span>
  <span class="hint">刷新索引：node tools/scan.mjs</span>
</footer>

<script src="assets/app.js?v=20261126a"></script>
</body>
</html>
